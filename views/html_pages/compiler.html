<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiler</title>
    <link rel="stylesheet" href="css/compiler.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <button onclick="window.location.href='homepage.html'">Home</button>
            <button id="compileBtn">Compile</button>
        </div>
        <div class="split-view">
            <div class="panel panel-input">
               
                <textarea id="inputField" placeholder="Type here"></textarea>
            </div>
            <div class="panel panel-output">
            
                <div class="pdf-container">
                    <object id="displayField" type="application/pdf" data="">
                        <p>PDF viewer not supported. <a href="#">Download PDF</a></p>
                    </object>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const compileBtn = document.getElementById('compileBtn');
            const inputField = document.getElementById('inputField');
            const displayField = document.getElementById('displayField');

            function compile() {
                const content = inputField.value;
                if (!content.trim()) {
                    showStatus('Empty input', '#c92a2a');
                    return;
                }
                
                // Your PDF generation logic here
                // For demo: update fallback text to show it worked
                const fallback = displayField.querySelector('p');
                if (fallback && (!displayField.data || displayField.data === '')) {
                    fallback.innerHTML = `Compiled: "${content.substring(0, 100)}${content.length > 100 ? '...' : ''}"`;
                }
                
                showStatus('Compiled successfully', '#2b8c4a');
            }

            function showStatus(msg, color) {
                const existing = document.querySelector('.status-toast');
                if (existing) existing.remove();
                
                const toast = document.createElement('div');
                toast.className = 'status-toast';
                toast.textContent = msg;
                toast.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: ${color};
                    color: white;
                    padding: 8px 16px;
                    font-size: 13px;
                    font-family: monospace;
                    z-index: 1000;
                    pointer-events: none;
                `;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }

            compileBtn.addEventListener('click', compile);
            
            // Ctrl+Enter shortcut
            inputField.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    compile();
                }
            });
        })();
    </script>
</body>
</html>
